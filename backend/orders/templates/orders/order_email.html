<div style="display:none;font-size:1px;color:#ffffff;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
  {{ preheader }}
</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="background:#ffffff;padding:24px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #EADFD4;">
        <tr>
          <td>

            <!-- ===== HEADER ===== -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:linear-gradient(120deg,#0F243B 0%,#143A63 58%,#E0630E 130%);">
              <tr>
                <td align="center" style="padding:28px 24px 22px;">
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                    <tr>
                      <td bgcolor="#ffffff" style="background:#ffffff;border-radius:50%;width:48px;height:48px;" align="center" valign="middle">
                        <div style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;color:#F97316;line-height:48px;text-align:center;">ME</div>
                      </td>
                      <td style="padding-left:14px;">
                        <div style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;color:#ffffff;line-height:1.15;">Magic <span style="color:#F97316;">Expressway</span></div>
                        <div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;color:#9FB6D0;letter-spacing:1.5px;text-transform:uppercase;">Order update</div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- ===== HEADING ===== -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td style="padding:32px 36px 8px;">
                  <h1 style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;color:#0F243B;margin:0 0 10px;line-height:1.3;">{{ heading }}</h1>
                  <p style="font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#5B6574;line-height:1.6;margin:0;">{{ intro }}</p>
                </td>
              </tr>
            </table>

            <!-- ===== DETAILS ===== -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td style="padding:18px 36px 6px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #EEE6DC;border-radius:12px;">
                    {% for label, value in rows %}
                    <tr>
                      <td style="padding:11px 14px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#8A94A3;width:38%;{% if not forloop.last %}border-bottom:1px solid #F3EDE6;{% endif %}">{{ label }}</td>
                      <td style="padding:11px 14px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#0F243B;{% if not forloop.last %}border-bottom:1px solid #F3EDE6;{% endif %}">{{ value }}</td>
                    </tr>
                    {% endfor %}
                  </table>
                </td>
              </tr>
            </table>

            {% if link %}
            <!-- ===== CTA BUTTON ===== -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td align="center" style="padding:24px 36px 30px;">
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                    <tr>
                      <td bgcolor="#F97316" style="background:linear-gradient(90deg,#F97316,#E0630E);border-radius:12px;">
                        <a href="{{ link }}" style="display:inline-block;padding:14px 36px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:800;color:#ffffff;text-decoration:none;">{{ button_label }}</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            {% endif %}

            <!-- ===== FOOTER ===== -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:linear-gradient(120deg,#0F243B,#143A63);border-top:4px solid #F97316;">
              <tr>
                <td align="center" style="padding:22px 32px 18px;">
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#6D86A2;line-height:1.6;">
                    © {{ year }} Magic Expressway • Dar es Salaam, Tanzania<br/>
                    <span style="color:#F97316;">Need help?</span> &nbsp;support@magicexpressway.com
                  </div>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
